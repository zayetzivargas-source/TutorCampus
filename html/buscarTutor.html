<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorCampus - Buscar Tutor</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_bT.css">
    <link rel="icon" type="image/png" href="../favicon/favicon.ico">
</head>
<body>
    <div class="page-wrapper">
        <main class="login-card">

            <header class="card-header">
                <h1 class="app-title">TutorCampus</h1>
            </header>

            <form class="login-form" action="#" method="POST">
                <div class="buscar-Tutor">
                    <p class="role-label">Buscar Tutor</p>
                    <select name="" id="">
                        <option value="" selected disabled>Seleccione una materia</option>
                        <option value="INI">Ingles</option>
                        <option value="ETPR">Ética profesional</option>
                        <option value="APWE">Aplicaciones web</option>
                        <option value="DEAPMO">Desarrollo de aplicaciones móviles</option>
                        <option value="CAVAVA">Cálculo de varias variables</option>
                        <option value="ANDISO">Análisis y diseño de software</option>
                        <option value="ESDA">Estructura de datos</option>
                    </select>
                </div>

                <div class="input-Tutor input-group">
                    <input type="text" id="" placeholder="Tutor 1 - Materia - Calificación - [Ver perfil]" required autocomplete="">
                    <input type="text" id="" placeholder="Tutor 2 - Materia - Calificación - [Ver perfil]" required autocomplete="">
                    <input type="text" id="" placeholder="Tutor 3 - Materia - Calificación - [Ver perfil]" required autocomplete="">
                    <input type="text" id="" placeholder="Tutor 4 - Materia - Calificación - [Ver perfil]" required autocomplete="">
                </div>
                
            </form>

            
        </main>
    </div>
</body>
</html>
