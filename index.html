<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutorCampus - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="favicon/favicon.ico">
</head>
<body>

  <div class="page-wrapper">
    <main class="login-card">
      <header class="card-header">
        <h1 class="app-title">TutorCampus</h1>
        <h2 class="subtitle">INICIAR SESIÓN</h2>
      </header>

      <form class="login-form" action="#" method="POST">
        <div class="input-group">
          <input type="email" id="email" placeholder="Correo Institucional" required autocomplete="email">
        </div>

        <div class="input-group">
          <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
        </div>
        <a href="html/logeado_pantalla.html" class="btn-link">
          <button type="button" class="btn btn-primary">Entrar</button>
        </a>

        <div class="divider-container">
          <hr class="divider">
          <p class="account-prompt">¿No tienes cuenta?</p>
        </div>

        <a href="html/registro.html" class="btn-link">
           <button type="button" class="btn btn-primary">Crear cuenta</button>
        </a>
        <div class="role-selection">
          <p class="role-label">Selecciona tu rol:</p>
          <div class="role-buttons">
            <button type="button" class="btn btn-role">Soy estudiante</button>
            <button type="button" class="btn btn-role">Soy tutor</button>
          </div>
        </div>
      </form>
    </main>
  </div>

</body>
</html>
